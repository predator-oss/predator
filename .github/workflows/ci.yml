name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run unit-tests

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter predator-ui run build

  integration:
    # Same five database/platform combos the project has always gated on,
    # driven through the existing tests/integration-tests/run.sh scripts.
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            platform: kubernetes
          - db: sqlite
            platform: kubernetes
          - db: postgres
            platform: metronome
          - db: sqlite
            platform: docker
          - db: sqlite
            platform: awsFargate
    name: integration (${{ matrix.db }} / ${{ matrix.platform }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./tests/integration-tests/run.sh
        env:
          LOCAL_TEST: 'true'
          DATABASE_TYPE: ${{ matrix.db }}
          JOB_PLATFORM: ${{ matrix.platform }}
