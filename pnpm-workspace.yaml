packages:
  - 'ui'
  - 'mcp'

overrides:
  "lodash": "$lodash"
  "node-fetch": "^2.7.0"
  "d3-color": "^3.1.0"
  "react-tooltip>uuid": "$uuid"
  "brace-expansion": "^5.0.8"
  "uuid": "$uuid"
  "z-schema>validator": "^13.15.15"
  "sequelize>sqlite3": "$sqlite3"
  "sequelize>tedious": "$tedious"

# Build scripts: only sqlite3 compiles a native binding we need. The rest are
# optional native accelerators, funding banners, or prebuilt fetchers that
# work fine without their install scripts.
allowBuilds:
  '@parcel/watcher': false
  core-js: false
  cpu-features: false
  dtrace-provider: false
  es5-ext: false
  jss: false
  protobufjs: false
  sqlite3: true
  ssh2: false
  unrs-resolver: false
